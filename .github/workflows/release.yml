name: Release package to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
      - uses: actions/checkout@v4
        # ensure that a publication only occurs when a new release is created:
        if: ${{ steps.release.outputs.release_created }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('bun.lockb', 'bunfig.toml') }}
        if: ${{ steps.release.outputs.release_created }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      - name: Build package
        run: bun run build
        if: ${{ steps.release.outputs.release_created }}
      - uses: actions/setup-node@v4
        with:
          # 24.x ships npm 11.17.x; trusted publishing needs >= 11.5.1
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}
      # Authenticates via OIDC against the trusted publisher configured at
      # npmjs.com/package/@zodiaceco/sdk/access. No npm token involved; the
      # binding is to this repo + this workflow filename, so renaming this
      # file means updating that setting.
      - name: Publish package to npm
        run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
