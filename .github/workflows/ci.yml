name: Continuous integration checks

on: [push]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('bun.lockb', 'bunfig.toml') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun check:format
      - name: Build package
        run: bun run build
      - name: Install dependencies of @zodiaceco/create
        run: bun install --frozen-lockfile
        working-directory: create
      - name: Check types of @zodiaceco/create
        run: bun run check:types
        working-directory: create
      - name: Build @zodiaceco/create
        run: bun run build
        working-directory: create

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-modules-${{ hashFiles('bun.lockb', 'bunfig.toml') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Install dependencies of @zodiaceco/create
        run: bun install --frozen-lockfile
        working-directory: create
      - name: Run tests of @zodiaceco/create
        run: bun run test
        working-directory: create

  runtimes:
    # The CLI loads a project's TypeScript files itself, so check it runs a
    # project @zodiaceco/create makes under each runtime, with the SDK
    # installed from a packed release.
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-22, node-24, bun]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        if: startsWith(matrix.runtime, 'node-')
        with:
          node-version: ${{ matrix.runtime == 'node-22' && 22 || 24 }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pack the SDK
        run: bun run build && npm pack --pack-destination "$RUNNER_TEMP"
      - name: Build @zodiaceco/create
        run: bun install --frozen-lockfile && bun run build
        working-directory: create
      - name: Run a project @zodiaceco/create makes
        run: scripts/check-runtime.sh ${{ startsWith(matrix.runtime, 'node-') && 'node' || 'bun' }} "$RUNNER_TEMP"/zodiaceco-sdk-*.tgz
